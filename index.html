<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NexoNest & Portfolio — refined</title>

    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />

    <!-- Small perf win: warm up likely next pages -->
    <link rel="prefetch" href="nexonest.html" as="document" />
    <link rel="prefetch" href="portfolio.html" as="document" />
  </head>
  <body>
    <div class="stage">

      <section class="block nexo">
        <a
          href="nexonest.html"
          class="circle"
          aria-label="NexoNest — startup perspective"
        ></a>

        <div class="text">
          <h1>NexoNest</h1>
          <p>
            <span
              class="arrow-link"
              data-url="nexonest.html"
              role="link"
              tabindex="0"
              aria-label="Go to NexoNest — from the startup point of view"
              onclick="location.assign(this.getAttribute('data-url'))"
              onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();this.click();}"
            >
              <span class="arrow arrow-left" aria-hidden="true"></span>
              |From the startup POV|
            </span>
          </p>
        </div>
      </section>

      <section class="block portfolio">
        <a
          href="portfolio.html"
          class="circle"
          aria-label="Portfolio — founder perspective"
        ></a>

        <div class="text">
          <h1>Portfolio</h1>
          <p>
            <span
              class="arrow-link"
              data-url="portfolio.html"
              role="link"
              tabindex="0"
              aria-label="Go to Portfolio — from the founder point of view"
              onclick="location.assign(this.getAttribute('data-url'))"
              onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();this.click();}"
            >
              |From the founder POV|
              <span class="arrow arrow-right" aria-hidden="true"></span>
            </span>
          </p>
        </div>
      </section>

      <div class="connector" aria-hidden="true"></div>

      <!-- Keep your visual style, but expose heading semantics -->
      <p class="headline" role="heading" aria-level="1">Choose Your Path</p>
    </div>

    <script src="js/nav.js" defer></script>
  </body>
</html>
