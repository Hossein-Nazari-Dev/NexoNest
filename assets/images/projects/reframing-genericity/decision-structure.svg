<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 730" role="img" aria-labelledby="title desc"><title id="title">Shared reasoning, context-specific outcomes</title><desc id="desc">Context and designer judgement enter a transferable decision structure. Evaluation of the resulting spatial response feeds back into priorities and the procedure.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="m1 1 8 4-8 4" fill="none" stroke="#1b3438" stroke-width="1.5"/></marker></defs><g font-family="Arial, sans-serif" fill="#1b3438"><g fill="#e8f2f0" stroke="#7fb7a8" stroke-width="2"><rect x="30" y="26" width="300" height="140" rx="8"/><rect x="350" y="26" width="300" height="140" rx="8"/><rect x="70" y="250" width="500" height="140" rx="8" fill="#c9e0d8"/><rect x="70" y="464" width="500" height="94" rx="8"/><rect x="70" y="622" width="500" height="80" rx="8"/></g><g text-anchor="middle"><text x="180" y="67" font-size="25" font-weight="700">Context</text><text x="180" y="105" font-size="22">Spatial · Environmental</text><text x="180" y="135" font-size="22">Social conditions</text><text x="500" y="67" font-size="25" font-weight="700">Designer judgement</text><text x="500" y="105" font-size="22">Goals · Priorities</text><text x="500" y="135" font-size="22">Criteria for sufficiency</text><text x="320" y="294" font-size="25" font-weight="700">Transferable decision structure</text><text x="320" y="333" font-size="22">Define relationships · Generate options</text><text x="320" y="365" font-size="22">Compare consequences</text><text x="320" y="503" font-size="25" font-weight="700">Context-specific response</text><text x="320" y="537" font-size="22">Form and spatial organisation</text><text x="320" y="671" font-size="25" font-weight="700">Evaluate consequences</text></g><g fill="none" stroke="#1b3438" stroke-width="2.5" marker-end="url(#arrow)"><path d="M180 166v42h80v42M500 166v42H380v42M320 390v74M320 558v64"/><path d="M570 662h62V192h-74" stroke-dasharray="7 6"/><path d="M632 420H536v-30" stroke-dasharray="7 6"/></g><text x="605" y="480" text-anchor="middle" font-size="21" transform="rotate(-90 605 480)">Revise priorities and procedure</text></g></svg>
